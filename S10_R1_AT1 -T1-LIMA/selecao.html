<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pesquisa de Satisfação</title>
</head>

<body>

    <h1>Pesquisa de Satisfação</h1>

    <form>

        <h3>Dados do Cliente</h3>

        <label for="nome">
        Nome:
        </label>
        <br>
        <input type="text"
        id="nome"
        name="nome" placeholder="Digite seu Nome Completo"
        required>
        <br><br>
        <label for="email">
            E-Mail:
        </label>
        <br>
        <input type="email"
        id="email"
        name="email"
        placeholder="Digite seu E-Mail"
        required>
        <br><br>
        <label for="telefone">
            Telefone:
        </label>
        <br>
        <input type="tel"
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(00)00000-0000">
        <br><br>

        <h3>Avaliação Geral</h3>

        <input type="radio" name="avaliacao" id="otimo" required>
        <label for="otimo">Ótimo</label>

        <br>

        <input type="radio" name="avaliacao" id="bom">
        <label for="bom">Bom</label>

        <br>

        <input type="radio" name="avaliacao" id="regular">
        <label for="regular">Regular</label>

        <br>

        <input type="radio" name="avaliacao" id="ruim">
        <label for="ruim">Ruim</label>

        <br><br>

        <h3>Serviços Utilizados</h3>

        <input type="checkbox" id="atendimento">
        <label for="atendimento">Atendimento</label>

        <br>

        <input type="checkbox" id="suporte">
        <label for="suporte">Suporte</label>

        <br>

        <input type="checkbox" id="treinamento">
        <label for="treinamento">Treinamento</label>

        <br>

        <input type="checkbox" id="consultoria">
        <label for="consultoria">Consultoria</label>

        <br><br>

        <h3>Unidade Atendida</h3>

        <select id="unidade">

            <option>Selecione uma unidade</option>

            <option>Americana</option>

            <option>Campinas</option>

            <option>São Paulo</option>

            <option>Piracicaba</option>

        </select>

        <br><br>

        <h3>Comentários</h3>

        <label for="comentario">Deixe sua opinião:</label>

        <br>

        <textarea id="comentario" rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit">
            Enviar
        </button>

        <button type="reset">
            Limpar
        </button>

    </form>

</body>

</html>
